AWSTemplateFormatVersion: "2010-09-09"
Description: >
  NT548 - Stack 1/4 (nt548-network): VPC 2 AZ, 2 public subnet + 2 private subnet,
  Internet Gateway, 1 NAT Gateway, S3 Gateway Endpoint. Node EKS nằm ở private subnet.

# Luồng mạng:
#   Internet ⇄ Internet Gateway ⇄ public subnet (NAT Gateway, Load Balancer của frontend)
#   Node EKS (private subnet) → NAT Gateway → Internet   (chỉ đi RA được, Internet không chạm VÀO node)
#   Node EKS → S3 Gateway Endpoint → S3                  (layer image ECR, miễn phí, không qua NAT)

Parameters:
  ProjectName:
    Type: String
    Default: nt548
    Description: Tiền tố đặt tên và tên export cho các stack khác dùng
  ClusterName:
    Type: String
    Default: nt548-eks
    Description: Tên cluster EKS, dùng để gắn tag cho subnet
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16

Resources:
  # ---------- VPC ----------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true        # EKS BẮT BUỘC bật 2 dòng này
      EnableDnsHostnames: true      # (node cần phân giải DNS endpoint của cluster)
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-vpc" }
        - { Key: Project, Value: !Ref ProjectName }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-igw" }
        - { Key: Project, Value: !Ref ProjectName }

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ---------- Subnet: 2 AZ × (public + private) ----------
  # !GetAZs '' = danh sách AZ của region; !Select [0, ...] = AZ thứ nhất
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-public-1" }
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: kubernetes.io/role/elb, Value: "1" }          # cho Kubernetes biết đặt Load Balancer PUBLIC ở đây
        - { Key: !Sub "kubernetes.io/cluster/${ClusterName}", Value: shared }

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-public-2" }
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: kubernetes.io/role/elb, Value: "1" }
        - { Key: !Sub "kubernetes.io/cluster/${ClusterName}", Value: shared }

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false    # node KHÔNG có IP public
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-private-1" }
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: kubernetes.io/role/internal-elb, Value: "1" } # Load Balancer NỘI BỘ (nếu có) đặt ở đây
        - { Key: !Sub "kubernetes.io/cluster/${ClusterName}", Value: shared }

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-private-2" }
        - { Key: Project, Value: !Ref ProjectName }
        - { Key: kubernetes.io/role/internal-elb, Value: "1" }
        - { Key: !Sub "kubernetes.io/cluster/${ClusterName}", Value: shared }

  # ---------- Route table PUBLIC: 0.0.0.0/0 → Internet Gateway ----------
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-public-rt" }
        - { Key: Project, Value: !Ref ProjectName }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment   # IGW phải gắn vào VPC xong mới tạo route được
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  # ---------- NAT Gateway (1 cái, đặt ở AZ 1 để tiết kiệm) ----------
  # ĐÁNH ĐỔI có chủ đích: AZ 1 hỏng thì node ở AZ 2 mất đường ra Internet.
  # Production sẽ dùng mỗi AZ 1 NAT.
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-nat-eip" }
        - { Key: Project, Value: !Ref ProjectName }

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1    # NAT luôn nằm ở PUBLIC subnet
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-nat" }
        - { Key: Project, Value: !Ref ProjectName }

  # ---------- Route table PRIVATE: 0.0.0.0/0 → NAT Gateway ----------
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-private-rt" }
        - { Key: Project, Value: !Ref ProjectName }

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ---------- S3 Gateway Endpoint (miễn phí) ----------
  # Layer image của ECR lưu trên S3 → node kéo image qua endpoint này, không tốn phí NAT theo GB
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      RouteTableIds:
        - !Ref PrivateRouteTable

# Export để stack nt548-eks dùng (Fn::ImportValue).
# Khi còn stack khác đang import, CloudFormation KHÔNG cho xóa stack này → ép xóa đúng thứ tự.
Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${ProjectName}-VpcId" }
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
    Export: { Name: !Sub "${ProjectName}-PublicSubnetIds" }
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
    Export: { Name: !Sub "${ProjectName}-PrivateSubnetIds" }
