      # - if: always()
      #   uses: actions/upload-artifact@v7
      #   with:
      #     name: report-trivy-${{ matrix.service }}
      #     path: reports/trivy-${{ matrix.service }}.json
      #     if-no-files-found: ignore

      # --- [Thuận] Bỏ comment khi đã có stack nt548-iam (secret AWS_ROLE_ARN) và nt548-ecr ---
      # - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      #     aws-region: ${{ env.AWS_REGION }}
      # - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   id: ecr
      #   uses: aws-actions/amazon-ecr-login@v2
      # - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      #   run: |
      #     IMAGE=${{ steps.ecr.outputs.registry }}/nt548/${{ matrix.service }}:${{ github.sha }}
      #     docker tag local/${{ matrix.service }}:${{ github.sha }} "$IMAGE"
      #     docker push "$IMAGE"

  # ===== [TV2] BẮT ĐẦU: job ai-report (xem docs/team/02-TV2-AI-SECURITY-ANALYZER.md) =====
  ai-report:
    needs: [sonar, build-scan-push]
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true    # AI lỗi cũng không làm đỏ pipeline
    steps:
      - run: echo "Chỗ chờ - TV2 thay bằng AI Security Analyzer"
  # ===== [TV2] KẾT THÚC =====

